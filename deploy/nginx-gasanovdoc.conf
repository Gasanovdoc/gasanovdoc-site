# /etc/nginx/sites-available/gasanovdoc  (HTTPS-блоки добавит certbot)
server {
    listen 80;
    listen [::]:80;
    server_name www.gasanovdoc.ru;
    return 301 https://gasanovdoc.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name gasanovdoc.ru;

    root /var/www/gasanovdoc/dist;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; frame-src https://mc.yandex.ru https://mc.yandex.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location /media/  { expires 30d; access_log off; }

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 15s;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
